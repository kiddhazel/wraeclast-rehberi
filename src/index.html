<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wraeclast Rehberi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M16 5 L25 16 L16 27 L7 16 Z" fill="var(--unique)"/>
        <path d="M16 11 L21 16 L16 21 L11 16 Z" fill="var(--bg)"/>
      </svg>
      <h1>Wraeclast Rehberi</h1>
    </div>
    <div class="topbar-right">
      <span id="status" class="status" title="Log durumu"><i></i><span>Bağlanıyor…</span></span>
      <button id="btn-pin" class="icon-btn" title="Her zaman üstte" aria-label="Her zaman üstte" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 3h6l-1 6 4 4H6l4-4-1-6Z"/><path d="M12 13v8"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" title="Ayarlar" aria-label="Ayarlar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="campaign" role="tab">
      <svg viewBox="0 0 24 24"><path d="M4 5c3-1 5-1 8 1 3-2 5-2 8-1v14c-3-1-5-1-8 1-3-2-5-2-8-1Z"/><path d="M12 6v14"/></svg>
      <span>Kampanya</span>
    </button>
    <button class="tab" data-tab="build" role="tab" lang="en">
      <svg viewBox="0 0 24 24"><path d="M12 3 4 7v6c0 4 3.5 7 8 8 4.5-1 8-4 8-8V7Z"/></svg>
      <span>Build</span>
    </button>
    <button class="tab" data-tab="pob" role="tab" lang="en">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M8 7l3 9M16 7l-3 9M8.2 6h7.6"/></svg>
      <span>PoB</span>
    </button>
    <button class="tab" data-tab="price" role="tab">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v10M9.5 9.5c0-1.2 1.1-2 2.5-2s2.5.8 2.5 2-1.1 1.7-2.5 2-2.5.8-2.5 2 1.1 2 2.5 2 2.5-.8 2.5-2"/></svg>
      <span>Fiyat</span>
    </button>
  </nav>

  <!-- ============ KAMPANYA ============ -->
  <main id="tab-campaign" class="tab-panel">
    <section class="charbar">
      <div><span class="label">Karakter</span><strong id="char-info">—</strong></div>
      <div><span class="label">Bölge</span><strong id="area-info">—</strong></div>
      <div id="xp-hint" class="xp-hint"></div>
    </section>

    <section class="acts" id="act-strip" aria-label="Act seçimi"></section>

    <section class="hero" id="hero">
      <div class="hero-head">
        <span class="hero-act" id="hero-act"></span>
        <span class="hero-count" id="hero-count"></span>
      </div>
      <h2 class="hero-zone" id="hero-zone" lang="en"></h2>
      <p class="hero-text" id="hero-text"></p>
      <div class="chips" id="hero-chips"></div>
      <div class="hero-next" id="hero-next"></div>
      <div class="hero-nav">
        <button id="btn-prev" class="btn ghost" title="Önceki adım (←)">‹ Geri</button>
        <button id="btn-done" class="btn gold" title="Tamamla ve ilerle (→)">Tamamlandı ›</button>
      </div>
    </section>

    <section class="act-summary" id="act-summary"></section>

    <ol class="steps" id="steps"></ol>
  </main>

  <!-- ============ BUILD ============ -->
  <main id="tab-build" class="tab-panel hidden">
    <nav class="build-cats" id="build-cats" aria-label="Build kategorileri"></nav>
    <div id="build-view"></div>
  </main>

  <!-- ============ POB ============ -->
  <main id="tab-pob" class="tab-panel hidden">
    <div class="input-row">
      <input id="pob-input" type="text" spellcheck="false" placeholder="PoB kodu veya pobb.in / pastebin linki" />
      <button id="pob-add" class="btn gold">Ekle</button>
    </div>
    <nav class="build-cats saved" id="pob-saved" aria-label="Kayıtlı build'ler"></nav>
    <div id="pob-view"></div>
  </main>

  <!-- ============ FİYAT ============ -->
  <main id="tab-price" class="tab-panel hidden">
    <div class="price-help">
      <p>Oyunda item'ın üzerine gel ve <kbd>Ctrl</kbd>+<kbd>C</kbd>'ye bas — fiyat burada belirir.</p>
      <input id="price-paste" type="text" placeholder="…ya da item metnini buraya yapıştır" />
    </div>
    <div id="price-view"></div>
    <div id="price-history"></div>
  </main>

  <footer class="totals" id="totals"></footer>
  <button class="step-strip hidden" id="step-strip" title="Kampanyaya dön"></button>

  <!-- ============ AYARLAR ============ -->
  <div class="drawer hidden" id="drawer" role="dialog" aria-label="Ayarlar">
    <div class="drawer-inner">
      <div class="drawer-head">
        <h3>Ayarlar</h3>
        <button class="icon-btn" id="btn-close-settings" aria-label="Kapat">✕</button>
      </div>

      <h4 class="set-head">Log takibi</h4>
      <label class="field">
        <span>Client.txt yolu</span>
        <input id="log-path" type="text" spellcheck="false" placeholder="...\Path of Exile\logs\Client.txt" />
      </label>
      <div class="row">
        <button class="btn ghost" id="btn-detect">Otomatik bul</button>
        <button class="btn ghost" id="btn-browse">Dosya seç…</button>
        <button class="btn gold" id="btn-connect">Bağlan</button>
      </div>
      <p class="hint" id="settings-msg"></p>
      <label class="field check">
        <input type="checkbox" id="opt-auto" checked />
        <span>Bölgeye girince rehberi otomatik ilerlet</span>
      </label>
      <label class="field check">
        <input type="checkbox" id="opt-hide-done" />
        <span>Tamamlanan adımları gizle</span>
      </label>

      <div class="divider"></div>
      <h4 class="set-head">Fiyat</h4>
      <label class="field">
        <span>Lig</span>
        <select id="opt-league"><option value="">Otomatik (güncel lig)</option></select>
      </label>
      <label class="field check">
        <input type="checkbox" id="opt-popup" checked />
        <span>Item kopyalanınca imlecin yanında popup aç</span>
      </label>
      <label class="field check">
        <input type="checkbox" id="opt-autosearch" checked />
        <span>Rare item'larda trade'i otomatik ara</span>
      </label>
      <label class="field check">
        <input type="checkbox" id="opt-price-tab" checked />
        <span>Popup kapalıyken Fiyat sekmesine geç</span>
      </label>
      <label class="field">
        <span>Mod değerlerinde aşağı pay (%)</span>
        <input id="opt-spread" type="number" min="0" max="50" step="1" />
      </label>

      <div id="sim-box" class="hidden">
        <div class="divider"></div>
        <label class="field">
          <span>Önizleme: bölgeye girişi simüle et</span>
          <input id="sim-zone" type="text" placeholder="örn. The Mud Flats" />
        </label>
        <p class="hint">Tarayıcı önizlemesinde log okunamaz; buradan test edebilirsin.</p>
      </div>

      <div class="divider"></div>
      <button class="btn danger" id="btn-reset">Kampanya ilerlemesini sıfırla</button>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="data/acts.js"></script>
  <script src="data/builds.js"></script>
  <script src="app.js"></script>
  <script src="builds-ui.js"></script>
  <script src="tree.js"></script>
  <script src="pob.js"></script>
  <script src="price-core.js"></script>
  <script src="price-ui.js"></script>
  <script src="price.js"></script>
</body>
</html>
